# 设置弹窗尺寸（@dongasai/dsh-setting-pro）
#
# 一个 bundle 两半：
#   - Host 半边（index.js）没有 Host 行为，这一行存在的唯一目的是让
#     dsh-client-modules 从 loader 的条目里扫描到同一行的 dsh.client 声明，
#     从而把 client.js 送进浏览器；
#   - 浏览器半边（client.js）注入覆盖设置面板几何的 CSS，并在「设置 → 通用」
#     里注册一行宽高调节。
#
# 只插入一行插件；浏览器半边由 dsh-client-modules 扫描得到，不在这里重复注册。
- insert:
    - id: setting-pro
      name: '@dongasai/dsh-setting-pro'
